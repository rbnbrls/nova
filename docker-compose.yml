# Nova stack — deployed on the "Nova AI" VM, orchestrated by Coolify (Phase 1).
# GPU containers (ollama, whisper) use the NVIDIA Container Toolkit.
# For local dev without Coolify: `docker compose up -d`.

services:
  nova-core:
    build: ./services/nova-core
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/backups:/backups:ro
    networks:
      - nova-net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
    # GPU passthrough (requires NVIDIA Container Toolkit on the host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nova-net

  # --- Voice I/O (Phase 6). Wired into Home Assistant's Assist pipeline via Wyoming. ---
  whisper:
    image: rhasspy/wyoming-whisper:latest
    command: --model small --language nl --uri tcp://0.0.0.0:10300
    ports:
      - "10300:10300"
    volumes:
      - ./data/whisper:/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nova-net

  piper:
    image: rhasspy/wyoming-piper:latest
    command: --voice nl_NL-mls-medium --uri tcp://0.0.0.0:10200
    ports:
      - "10200:10200"
    volumes:
      - ./data/piper:/data
    restart: unless-stopped
    networks:
      - nova-net

  # --- Observability: ship logs + host metrics to OpenObserve (Coolify service) ---
  vector:
    image: timberio/vector:latest-alpine
    env_file: .env
    # OpenObserve's public hostname resolves to the WAN IP, which hairpins into
    # the router from inside the LAN. Pin it to the Coolify host's LAN IP so
    # Traefik receives the right SNI/Host and routes to OpenObserve.
    extra_hosts:
      - "${OPENOBSERVE_HOST:-openobserve.invalid}:${OPENOBSERVE_LAN_IP:-127.0.0.1}"
    volumes:
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - nova-net

  # --- OpenObserve alert → Forgejo issue bridge (closed-loop incident intake) ---
  ops-bridge:
    build: ./services/ops-bridge
    env_file: .env
    ports:
      - "8085:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nova-net

  radicale:
    image: tomsquest/docker-radicale:latest
    ports:
      - "5232:5232"
    volumes:
      - ./data/radicale:/data
    restart: unless-stopped
    networks:
      - nova-net

  caddy:
    image: caddy:2
    depends_on:
      - nova-core
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    restart: unless-stopped
    networks:
      - nova-net

networks:
  nova-net:
    name: nova-net
    external: false

