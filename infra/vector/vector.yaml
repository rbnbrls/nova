# Vector: ship Docker container logs + host metrics into OpenObserve.
# OpenObserve runs as a separate Coolify service; endpoint/creds come from .env.

sources:
  docker:
    type: docker_logs

  host:
    type: host_metrics
    scrape_interval_secs: 30

transforms:
  docker_enriched:
    type: remap
    inputs: [docker]
    source: |
      .service = .label."com.docker.compose.service" || .container_name
      .host = get_hostname() ?? "nova-ai-vm"

sinks:
  openobserve_logs:
    type: http
    inputs: [docker_enriched]
    # OPENOBSERVE_URL may be set with or without an http(s):// scheme (Coolify
    # auto-generates it with the scheme; a hand-rolled .env may omit it).
    # OPENOBSERVE_HOST is always bare. We build the URI from the host and force
    # http:// to avoid Vector's scheme-relative parsing doubling the prefix.
    uri: "http://${OPENOBSERVE_HOST}/api/${OPENOBSERVE_ORG}/docker/_json"
    method: post
    # OpenObserve is reached over LAN via Coolify's Traefik with a self-signed cert.
    tls:
      verify_certificate: false
    auth:
      strategy: basic
      user: "${OPENOBSERVE_USER}"
      password: "${OPENOBSERVE_PASSWORD}"
    compression: gzip
    encoding:
      codec: json
      timestamp_format: rfc3339
    healthcheck:
      enabled: false

  openobserve_metrics:
    type: prometheus_remote_write
    inputs: [host]
    endpoint: "http://${OPENOBSERVE_HOST}/api/${OPENOBSERVE_ORG}/prometheus/api/v1/write"
    tls:
      verify_certificate: false
    auth:
      strategy: basic
      user: "${OPENOBSERVE_USER}"
      password: "${OPENOBSERVE_PASSWORD}"
    healthcheck:
      enabled: false
